name: Pinterest を書き出す

# Pinterest の公開ボードを読み、data/pinterest/<ユーザー>.json を更新する
on:
  workflow_dispatch:
    inputs:
      user:
        description: Pinterest のユーザー名
        default: pinkojing
      boards:
        description: ボード名(カンマ区切り、* で全部)
        default: ft
  schedule:
    - cron: '17 18 * * 0'   # 毎週月曜 3:17(日本時間)
  push:
    branches: [main]
    paths:
      - tools/pinterest-export.mjs
      - .github/workflows/pinterest-export.yml

permissions:
  contents: write

concurrency:
  group: pinterest-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 書き出し
        id: export
        run: |
          mkdir -p data/pinterest
          set -o pipefail
          export PINTEREST_DEBUG=1
          node tools/pinterest-export.mjs "${{ github.event.inputs.user || 'pinkojing' }}" "${{ github.event.inputs.boards || 'ft' }}" 2>&1 | tee data/pinterest/last-run.log
      - name: 変更をコミット(失敗してもログは残す)
        if: always()
        run: |
          git add data/pinterest
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pinterest の書き出しを更新"
          git pull --rebase origin main
          git push origin HEAD:main
